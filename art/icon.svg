<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="0.55" stop-color="#3D6BFF"/>
      <stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a1040" flood-opacity="0.45"/>
    </filter>
    <filter id="gshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101a6a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  </g>
  <!-- glyph: 100-unit box mapped onto the icon's centre -->
  <g transform="translate(212 212) scale(6)" filter="url(#gshadow)">
    <!-- phone -->
    <rect x="10" y="44" width="24" height="42" rx="6" fill="#fff"/>
    <rect x="18" y="47.5" width="8" height="2" rx="1" fill="#4a66ff"/>
    <!-- laptop -->
    <rect x="56" y="56" width="34" height="23" rx="3.5" fill="#fff"/>
    <rect x="50" y="81" width="46" height="5" rx="2.5" fill="#fff"/>
    <!-- the hop -->
    <path d="M22 37 C 26 6, 66 4, 72 41" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M64.5 37.5 L72.6 50 L80 37" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
