# Checks that both apps still compile (unsigned, nothing published).
# Manual for now; switch `on:` back to push/pull_request once GitHub Actions is available on the account.
name: Build

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
        working-directory: android

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
        working-directory: mac
